<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Timesheet</title>
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#1f6f5c"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><link rel="icon" href="/icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ea;--card:#fffdf8;--ink:#1d2420;--muted:#6b726c;--line:#e3ded2;--soft:#efeadf;
  --accent:#1f6f5c;--accent-ink:#fff;--accent-soft:#dcebe5;--danger:#b3402e;--warn:#b9791c;
  --shadow:0 1px 0 rgba(0,0,0,.03),0 8px 24px -14px rgba(40,35,20,.25);
  --serif:"Fraunces",Georgia,serif;--sans:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#111613;--card:#192019;--ink:#e8ebe6;--muted:#93a099;--line:#28322d;--soft:#202922;
  --accent:#4fb99b;--accent-ink:#0b1410;--accent-soft:#1c3029;--danger:#e0705c;--warn:#e0a84e;--shadow:none}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);font-variant-numeric:tabular-nums}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 80px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand{font:600 26px/1 var(--serif);letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.brand i{width:12px;height:12px;border-radius:50%;background:var(--accent);display:inline-block}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted)}
.chip b{color:var(--ink);font-weight:700}
nav.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:12px;margin-bottom:18px;width:fit-content;max-width:100%;overflow:auto}
nav.tabs button{border:0;background:transparent;color:var(--muted);font:500 14px var(--sans);padding:8px 16px;border-radius:9px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected=true]{background:var(--card);color:var(--ink);box-shadow:var(--shadow);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.card h2{font:600 18px var(--serif);margin:0 0 12px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 200px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
label.f{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px;letter-spacing:.02em}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
input[type=radio]{display:none}
.btn{font:700 14px var(--sans);border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 14px;cursor:pointer}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--danger)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:6px 9px}
.btn.ghost:hover{color:var(--ink);background:var(--soft)}
.btn.sm{padding:6px 10px;font-size:13px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.timer{text-align:center;padding:26px 18px}
.timer.live{border-color:var(--accent);background:linear-gradient(180deg,var(--accent-soft),var(--card) 70%)}
.clock{font:500 clamp(44px,12vw,72px)/1.05 var(--serif);letter-spacing:-.02em;margin:6px 0 16px}
.timer .row{justify-content:center}
.timer .fields{max-width:640px;margin:0 auto 14px;text-align:left}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.day{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 6px;font-weight:700}
.day span{color:var(--muted);font-weight:500;font-size:13px}
.entry{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.entry .t{flex:1;min-width:0}
.entry .t b{display:block;font-weight:700}
.entry .t span{color:var(--muted);font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .d{font-weight:700;min-width:48px;text-align:right}
.tag{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted);margin-left:6px;font-weight:500}
table{border-collapse:collapse;width:100%}
th,td{padding:10px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--muted);font-weight:700}
th.today{color:var(--accent)}
td.cell{cursor:pointer;border-radius:8px}
td.cell:hover{background:var(--accent-soft)}
td.zero{color:var(--line)}
td.today{background:color-mix(in srgb,var(--accent-soft) 55%,transparent)}
tfoot td{font-weight:700;border-bottom:0}
.scroll{overflow-x:auto;margin:0 -6px;padding:0 6px}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.over>i{background:var(--danger)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
@media(max-width:760px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.tile .v{font:600 28px var(--serif);margin-top:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:99px;padding:6px 12px;font:500 13px var(--sans);cursor:pointer}
.chips button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.chart{display:flex;align-items:flex-end;gap:3px;height:140px;padding-top:8px}
.chart div{flex:1;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px;opacity:.9}
.chart div.z{background:var(--line);opacity:1}
.chartx{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}
.proj{display:flex;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.proj:first-of-type{border-top:0}
.proj .grow{min-width:0}
.proj.arch{opacity:.55}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches label{width:28px;height:28px;border-radius:50%;cursor:pointer;border:3px solid transparent;display:block}
.swatches input:checked+label{border-color:var(--ink)}
.empty{text-align:center;padding:48px 18px}
.empty h2{font-size:24px}
#modal{position:fixed;inset:0;background:rgba(15,20,17,.5);display:none;align-items:flex-start;justify-content:center;padding:6vh 14px;overflow:auto;z-index:20}
#modal.open{display:flex}
.sheet{background:var(--card);border-radius:18px;padding:20px;width:100%;max-width:480px;border:1px solid var(--line)}
.sheet.wide{max-width:640px}
.sheet h3{font:600 20px var(--serif);margin:0 0 14px}
.field{margin-bottom:12px}
.err{color:var(--danger);font-size:13px;min-height:18px;margin:4px 0}
.foot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;display:none;gap:14px;align-items:center;z-index:30;box-shadow:0 8px 30px rgba(0,0,0,.3)}
#toast button{background:none;border:0;color:inherit;font:700 14px var(--sans);text-decoration:underline;cursor:pointer;padding:0}
.warn{background:color-mix(in srgb,var(--warn) 14%,var(--card));border:1px solid var(--warn);border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:14px}
pre.out{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font:13px/1.5 ui-monospace,Menlo,monospace;max-height:50vh;overflow:auto}

.invoice{background:#fff;color:#111;border-radius:10px;padding:26px;font-size:14px}
.invoice table{color:#111}.invoice th,.invoice td{border-color:#ddd}.invoice th{color:#555}
.inv-h,.inv-m{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:22px}
.inv-t{font:600 30px var(--serif);letter-spacing:.04em}
.inv-m span{color:#666;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.st{font-size:11px;font-weight:700;border-radius:99px;padding:2px 8px;border:1px solid var(--line);color:var(--muted)}
.st.paid{color:var(--accent);border-color:var(--accent)}.st.sent{color:var(--warn);border-color:var(--warn)}.st.over{color:var(--danger);border-color:var(--danger)}
.ans{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:12px}
.keybox{font:13px ui-monospace,Menlo,monospace;word-break:break-all;background:var(--bg);border:1px dashed var(--accent);border-radius:10px;padding:10px;margin:10px 0}
.foot-links{text-align:center;margin-top:28px;font-size:13px;color:var(--muted)}.foot-links a{color:var(--muted)}
@media print{body>.wrap,#toast{display:none!important}body{background:#fff}#modal{position:static;display:block!important;background:none;padding:0}.sheet{border:0;max-width:none;padding:0;background:none}.sheet h3,.noprint{display:none!important}}
.stick{position:sticky;top:0;z-index:10;background:var(--bg);margin:-20px -16px 0;padding:14px 16px 1px;border-bottom:1px solid transparent}
.stick nav.tabs{margin-bottom:12px}
.stick header.top{margin-bottom:12px}
@media print{.stick{position:static}}
</style>
</head>
<body>
<div class="wrap">
  <div class="stick">
  <header class="top">
    <div class="brand"><i></i>Timesheet</div>
    <div class="row" id="hdr"></div>
  </header>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>
  <main id="main"></main>
</div>
<div id="modal"></div>
<div id="toast"></div>

<script>
(function(){
"use strict";
const LEGACY="timesheet.v1";
let KEY=LEGACY;
let user=null,authMode="login",authErr="",authInfo={needsCode:false};
const COLORS=["#1f6f5c","#c2562f","#3b6fb6","#b9891c","#8a4fa0","#c04a77","#4c8a2f","#5b6b78"];
let storageOK=true;
function defaults(){return {projects:[],entries:[],timer:null,invoices:[],recurring:[],settings:{currency:"$",target:40,weekStart:1,biz:{name:"",address:"",email:"",taxId:"",taxRate:0,dueDays:14,payNote:"",payUrl:"",prefix:"INV-",nextNo:1}}}}
function norm(o){const d=defaults();o.invoices=o.invoices||[];o.recurring=o.recurring||[];o.settings=o.settings||d.settings;o.settings.biz=Object.assign(d.settings.biz,o.settings.biz||{});return o}
function load(){
  try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);const d=defaults();return {projects:o.projects||[],entries:o.entries||[],timer:o.timer||null,settings:Object.assign(d.settings,o.settings||{})}}}
  catch(e){storageOK=false}
  return defaults();
}
let S=defaults();
let synced=false,pushT=null,lastAt=0;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){storageOK=false}schedulePush()}
function schedulePush(){if(!synced)return;clearTimeout(pushT);pushT=setTimeout(push,400)}
function push(){
  pushT=null;
  return fetch("/api/data",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(S)}).then(async r=>{if(r.status===401)signedOut("Session expired. Please sign in again.");else if(r.ok){const j=await r.json().catch(()=>({}));if(j.updated_at)lastAt=j.updated_at}}).catch(()=>{});
}
async function flush(){if(pushT){clearTimeout(pushT)}await push()}
async function refresh(){
  try{const r=await fetch("/api/data",{cache:"no-store"});if(!r.ok)return;const j=await r.json();
    if(j.state&&j.updated_at>lastAt){S=norm(Object.assign(defaults(),j.state));lastAt=j.updated_at;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render()}}catch(e){}
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&user&&synced&&!pushT)refresh()});
function api(path,method,body){return fetch(path,{method:method||"GET",headers:{"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined}).then(async r=>{const j=await r.json().catch(()=>({}));if(r.status===401&&user){signedOut("Session expired. Please sign in again.");throw new Error("Signed out")}if(!r.ok)throw new Error(j.error||"Request failed");return j})}
function readLegacy(){
  try{const r=localStorage.getItem(LEGACY);if(!r)return null;const o=JSON.parse(r),d=defaults();return {projects:o.projects||[],entries:o.entries||[],timer:o.timer||null,settings:Object.assign(d.settings,o.settings||{})}}catch(e){return null}
}
async function hydrate(){
  try{
    const r=await fetch("/api/data",{cache:"no-store"});
    if(r.status===401){signedOut("Session expired. Please sign in again.");return}
    if(!r.ok)throw 0;
    const j=await r.json(),d=defaults();
    lastAt=j.updated_at||0;
    if(j.state){S={projects:j.state.projects||[],entries:j.state.entries||[],timer:j.state.timer||null,settings:Object.assign(d.settings,j.state.settings||{})};try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
    else if(!S.projects.length&&!S.entries.length){const l=readLegacy();if(l)S=l}
    synced=true;
    norm(S);if(applyRecurring())save();
    if(!j.state&&(S.projects.length||S.entries.length))push();
    render();
  }catch(e){}
}
async function enter(u){
  user=u;KEY=LEGACY+"."+u.id;synced=false;authErr="";
  S=load();
  render();
  hydrate();
}
function signedOut(msg){
  clearTimeout(pushT);user=null;S=defaults();synced=false;KEY=LEGACY;authErr=msg||"";closeModal();render();
}
async function boot(){
  try{
    const r=await fetch("/api/auth",{cache:"no-store"});
    const j=await r.json().catch(()=>({}));
    authInfo.needsCode=!!j.needsCode;
    if(r.ok&&j.user){enter(j.user);return}
    if(r.status!==401)authErr=j.error||"Server error";
  }catch(e){authErr="Cannot reach the server."}
  render();
}
function renderAuth(){
  $("#hdr").innerHTML="";$("#tabs").innerHTML="";
  const reg=authMode==="register";
  $("#main").innerHTML='<section class="card" id="authform" style="max-width:420px;margin:6vh auto 0"><div class="eyebrow">'+(reg?"Create account":"Welcome back")+'</div><h2 style="font-size:24px;margin:4px 0 14px">'+(reg?"Start tracking your time":"Sign in to Timesheet")+'</h2>'
   +'<div class="field"><label class="f" for="a-e">Email</label><input id="a-e" type="email" autocomplete="email" maxlength="200"></div>'
   +'<div class="field"><label class="f" for="a-p">Password'+(reg?" (8+ characters)":"")+'</label><input id="a-p" type="password" autocomplete="'+(reg?"new-password":"current-password")+'" maxlength="200"></div>'
   +(reg&&authInfo.needsCode?'<div class="field"><label class="f" for="a-c">Invite code</label><input id="a-c" autocomplete="off" maxlength="100"></div>':"")
   +'<div class="err" id="a-err">'+esc(authErr)+'</div>'
   +'<button class="btn primary" data-a="auth-submit" style="width:100%">'+(reg?"Create account":"Sign in")+'</button>'
   +'<p class="muted small" style="text-align:center;margin:14px 0 0">'+(reg?"Already have an account?":"New here?")+' <button class="btn ghost sm" data-a="auth-toggle">'+(reg?"Sign in":"Create an account")+'</button></p></section><p class="foot-links"><a href="/about">About</a> · <a href="/terms">Terms</a> · <a href="/privacy">Privacy</a></p>';
  document.title="Sign in · Timesheet";
  const e=$("#a-e");if(e)e.focus();
}
try{localStorage.setItem(KEY+".t","1");localStorage.removeItem(KEY+".t")}catch(e){storageOK=false}

const ui={tab:"track",wk:null,range:"week",from:"",to:"",inv:"",invNo:"",showAll:false,aiText:""};

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const pYmd=s=>{const a=s.split("-").map(Number);return new Date(a[0],a[1]-1,a[2])};
const addDays=(s,n)=>{const d=pYmd(s);d.setDate(d.getDate()+n);return ymd(d)};
const today=()=>ymd(new Date());
const hm=secs=>{const m=Math.round(secs/60);return Math.floor(m/60)+":"+pad(m%60)};
const clock=secs=>{secs=Math.max(0,Math.floor(secs));return Math.floor(secs/3600)+":"+pad(Math.floor(secs%3600/60))+":"+pad(secs%60)};
const dec=secs=>(secs/3600).toFixed(2);
const r2=n=>Math.round(n*100)/100;
const money=n=>S.settings.currency+Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const proj=id=>S.projects.find(p=>p.id===id);
const wkStart=s=>{const d=pYmd(s);d.setDate(d.getDate()-((d.getDay()-S.settings.weekStart+7)%7));return ymd(d)};
function nice(s){
  const t=today();
  if(s===t)return "Today";
  if(s===addDays(t,-1))return "Yesterday";
  return pYmd(s).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
}
function parseDur(t){
  t=String(t||"").trim().toLowerCase();if(!t)return null;
  let m=t.match(/^(\d+):(\d{1,2})$/);if(m)return(+m[1]*60+ +m[2])*60;
  m=t.match(/^(?:(\d+(?:\.\d+)?)\s*h(?:ours?|rs?)?)?\s*(?:(\d+(?:\.\d+)?)\s*m(?:in(?:ute)?s?)?)?$/);
  if(m&&(m[1]||m[2]))return Math.round(((+m[1]||0)*60+(+m[2]||0))*60);
  if(/^\d+(\.\d+)?$/.test(t))return Math.round(+t*3600);
  return null;
}
function entryAmt(e){const p=proj(e.projectId);return e.billable&&p?r2(e.secs/3600*(p.rate||0)):0}
const sum=(a,f)=>a.reduce((x,y)=>x+f(y),0);
function csvCell(v){v=String(v==null?"":v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function csvFor(list){
  const rows=[["Date","Project","Client","Description","Hours","Billable","Rate","Amount"]];
  list.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0).forEach(e=>{const p=proj(e.projectId)||{};rows.push([e.date,p.name||"",p.client||"",e.desc||"",dec(e.secs),e.billable?"yes":"no",p.rate||0,entryAmt(e).toFixed(2)])});
  return rows.map(r=>r.map(csvCell).join(",")).join("\n");
}

/* ---------- file / clipboard ---------- */
let DL=null;
try{if(window.claude&&claude.use){claude.use("downloads").then(d=>{DL=d}).catch(()=>{})}}catch(e){}
async function copyText(t,msg){
  try{await navigator.clipboard.writeText(t);toast(msg||"Copied");return true}catch(e){return false}
}
async function saveFile(name,data){
  if(DL){
    try{await DL.save({filename:name,data:data});toast("Saved "+name);return}
    catch(e){if(e&&e.code==="declined")return}
  }
  openModal("Copy your file",'<p class="muted small">Downloads are not available here. Copy this text and paste it into a file named <b>'+esc(name)+'</b>.</p><textarea id="raw" rows="12" readonly>'+esc(data)+'</textarea><div class="foot"><button class="btn" data-a="close">Close</button><button class="btn primary" data-a="copy-raw">Copy</button></div>',true);
  setTimeout(()=>{const t=$("#raw");if(t)t.select()},30);
}

/* ---------- toast / modal ---------- */
let toastT;
function toast(msg,label,fn){
  const t=$("#toast");t.innerHTML="<span>"+esc(msg)+"</span>"+(label?'<button id="tact">'+esc(label)+"</button>":"");
  t.style.display="flex";clearTimeout(toastT);
  if(label)$("#tact").onclick=()=>{fn();t.style.display="none"};
  toastT=setTimeout(()=>{t.style.display="none"},label?6000:2200);
}
function openModal(title,body,wide){
  const m=$("#modal");m.innerHTML='<div class="sheet'+(wide?" wide":"")+'" role="dialog" aria-modal="true"><h3>'+esc(title)+"</h3>"+body+"</div>";
  m.classList.add("open");
  const f=m.querySelector("input:not([type=radio]):not([type=checkbox]),select,textarea");if(f&&!wide)f.focus();
}
function closeModal(){$("#modal").classList.remove("open");$("#modal").innerHTML=""}
function confirmModal(title,text,yesLabel,fn){
  openModal(title,'<p>'+esc(text)+'</p><div class="foot"><button class="btn" data-a="close">Cancel</button><button class="btn danger" id="yes">'+esc(yesLabel)+"</button></div>");
  $("#yes").onclick=()=>{closeModal();fn()};
}

/* ---------- stats ---------- */
function weekRange(){const s=wkStart(ui.wk||today());return[s,addDays(s,6)]}
function secsBetween(a,b,f){return sum(S.entries.filter(e=>e.date>=a&&e.date<=b&&(!f||f(e))),e=>e.secs)}
function runningSecs(){return S.timer?(Date.now()-S.timer.start)/1000:0}

/* ---------- views ---------- */
function renderHeader(){
  const w=wkStart(today());
  const secs=secsBetween(w,addDays(w,6))+(S.timer&&S.timer.start>=pYmd(w).getTime()?runningSecs():0);
  $("#hdr").innerHTML='<span class="chip">This week <b>'+hm(secs)+"</b> / "+S.settings.target+'h</span><span class="chip">'+esc(user.email)+'</span><button class="btn sm" data-a="logout">Sign out</button>';
  const names={track:"Track",week:"Week",projects:"Projects",reports:"Reports",invoices:"Invoices",team:"Team",account:"Account"};
  $("#tabs").innerHTML=Object.keys(names).map(k=>'<button role="tab" data-a="tab" data-v="'+k+'" aria-selected="'+(ui.tab===k)+'">'+names[k]+"</button>").join("");

function rangeBounds(){
  const t=today(),d=pYmd(t),ws=wkStart(t);
  switch(ui.range){
    case "week":return[ws,addDays(ws,6)];
    case "lastweek":return[addDays(ws,-7),addDays(ws,-1)];
    case "month":return[ymd(new Date(d.getFullYear(),d.getMonth(),1)),ymd(new Date(d.getFullYear(),d.getMonth()+1,0))];
    case "lastmonth":return[ymd(new Date(d.getFullYear(),d.getMonth()-1,1)),ymd(new Date(d.getFullYear(),d.getMonth(),0))];
    case "30":return[addDays(t,-29),t];
    case "all":{const ds=S.entries.map(e=>e.date).sort();return[ds[0]||t,ds[ds.length-1]||t]}
    default:{const f=ui.from||t,u=ui.to||t;return f<=u?[f,u]:[u,f]}
  }
}

  h+='<div class="tiles"><div class="tile"><div class="eyebrow">Total time</div><div class="v">'+hm(tot)+'</div></div><div class="tile"><div class="eyebrow">Billable time</div><div class="v">'+hm(bs)+'</div></div><div class="tile"><div class="eyebrow">Earnings</div><div class="v">'+money(amt)+'</div></div><div class="tile"><div class="eyebrow">Avg / worked day</div><div class="v">'+(days?hm(tot/days):"0:00")+"</div></div></div>";
  // chart

    list.forEach(e=>{const k=weekly?wkStart(e.date):e.date;buckets.set(k,(buckets.get(k)||0)+e.secs)});

  h+='<section class="card"><h2>By project</h2>';

  h+='<div style="margin-top:12px"><button class="btn sm" data-a="csv-range">Export this range as CSV</button></div></section>';

  if(cand.length){

    const lines=items.map(e=>({e,amt:r2(e.secs/3600*(p.rate||0))})),total=sum(lines,l=>l.amt);

     +lines.map(l=>"<tr><td>"+l.e.date+'</td><td style="text-align:left;white-space:normal">'+(esc(l.e.desc)||"—")+"</td><td>"+dec(l.e.secs)+"</td><td>"+money(l.amt)+"</td></tr>").join("")
     +"</tbody><tfoot><tr><td colspan=\"2\">"+esc(p.client||p.name)+" · "+money(p.rate||0)+'/hr</td><td>'+dec(sum(items,e=>e.secs))+"</td><td>"+money(total)+'</td></tr></tfoot></table></div><div class="row" style="margin-top:14px"><button class="btn primary" data-a="inv-create">Create invoice</button><button class="btn" data-a="inv-copy">Copy text</button><button class="btn" data-a="inv-csv">Download CSV</button></div><p class="muted small" style="margin:10px 0 0">Entries already on an invoice are excluded, so nothing is billed twice.</p></section>';
  }

/* ---------- recurring ---------- */
function applyRecurring(){
  norm(S);let changed=false;const t=today();
  S.recurring.forEach(r=>{
    const p=proj(r.projectId);if(!p||p.archived)return;
    let d=r.last?addDays(r.last,1):r.start,n=0;
    while(d<=t&&n++<400){
      if(r.days.includes(pYmd(d).getDay())){S.entries.push({id:uid(),projectId:r.projectId,date:d,secs:r.secs,desc:r.desc||"",billable:r.billable,created:Date.now()+n,recurring:r.id});changed=true}
      d=addDays(d,1);
    }
    if(r.last!==t){r.last=t;changed=true}
  });
  return changed;
}
/* ---------- voice ---------- */
function voice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast("Voice input isn't supported in this browser");return}
  const r=new SR(),b=$("#ai-v");r.lang=navigator.language||"en-US";r.interimResults=false;
  if(b)b.textContent="Listening\u2026";
  r.onresult=e=>{const t=Array.from(e.results).map(x=>x[0].transcript).join(" ");ui.aiText=(ui.aiText?ui.aiText+" ":"")+t;const ta=$("#ai-t");if(ta)ta.value=ui.aiText};
  r.onend=()=>{const bb=$("#ai-v");if(bb)bb.textContent="\u{1F3A4} Dictate"};
  r.onerror=()=>toast("Couldn't hear that. Check microphone permission.");
  r.start();
}

async function askGo(){
  const q=(ui.askQ||"").trim(),b=$("#ask-b");if(!q){toast("Type a question first");return}
  b.disabled=true;b.textContent="Thinking\u2026";
  try{
    const j=await api("/api/parse","POST",{mode:"ask",question:q,today:today(),currency:S.settings.currency,projects:S.projects.map(p=>({name:p.name,client:p.client,rate:p.rate,budget:p.budget})),entries:S.entries.slice(-3000).map(e=>[e.date,(proj(e.projectId)||{}).name||"?",+dec(e.secs),e.billable?1:0])});

  }catch(e){if(e.message==="Signed out")return;ui.askAns="Couldn't answer: "+e.message}

/* ---------- invoices ---------- */
function createInvoice(){
  const p=proj(ui.inv);if(!p)return;
  const [a,b]=rangeBounds(),bz=S.settings.biz;
  const items=S.entries.filter(e=>e.projectId===p.id&&e.billable&&!e.invoiceId&&e.date>=a&&e.date<=b).sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:0);
  if(!items.length){toast("Nothing to invoice in this range");return}
  const lines=items.map(e=>({date:e.date,desc:e.desc||"Work",secs:e.secs,amt:r2(e.secs/3600*(p.rate||0))}));
  const subtotal=r2(sum(lines,l=>l.amt)),tax=r2(subtotal*(bz.taxRate||0)/100),id=uid();
  const custom=(ui.invNo||"").trim(),auto=(bz.prefix||"")+String(bz.nextNo||1).padStart(3,"0");
  S.invoices.push({id:id,no:custom||auto,projectId:p.id,from:a,to:b,issued:today(),due:addDays(today(),bz.dueDays||14),status:"draft",currency:S.settings.currency,rate:p.rate||0,taxRate:bz.taxRate||0,lines:lines,subtotal:subtotal,tax:tax,total:r2(subtotal+tax)});
  if(!custom)bz.nextNo=(bz.nextNo||1)+1;
  ui.invNo="";items.forEach(e=>{e.invoiceId=id});save();ui.tab="invoices";render();invoiceModal(id);
}
function invoiceModal(id){
  const i=S.invoices.find(x=>x.id===id);if(!i)return;

    const find=n=>S.projects.find(p=>p.name.toLowerCase()===n.toLowerCase());
    const newNames=new Set(j.entries.map(e=>e.project).filter(n=>!find(n)).map(n=>n.toLowerCase()));
    openModal("Review before adding",'<p class="muted small" style="margin-top:0">'+j.entries.length+" entries"+(newNames.size?", "+newNames.size+" new project"+(newNames.size>1?"s":"")+" will be created":"")+'.</p><div style="max-height:45vh;overflow:auto">'+j.entries.map(e=>'<div class="entry"><div class="t"><b>'+esc(e.project)+(find(e.project)?"":'<span class="tag" style="display:inline">new</span>')+(e.billable?"":'<span class="tag" style="display:inline">non-billable</span>')+"</b><span>"+esc(e.date)+" · "+(esc(e.description)||"No description")+'</span></div><div class="d">'+hm(e.minutes*60)+"</div></div>").join("")+'</div><div class="foot"><button class="btn" data-a="close">Cancel</button><button class="btn primary" data-a="ai-apply">Add all</button></div>',true);
  }catch(e){toast("AI parse failed: "+(e.message||"error"))}
  finally{const nb=$("#ai-b");if(nb){nb.disabled=false;nb.textContent="Parse & preview"}}
}
function aiApply(){
  const j=pendingAI;if(!j)return;
  const find=n=>S.projects.find(p=>p.name.toLowerCase()===n.toLowerCase());
  const meta=new Map((j.new_projects||[]).map(p=>[p.name.toLowerCase(),p]));
  let n=0;
  j.entries.forEach(e=>{
    let p=find(e.project);
    if(!p){const m=meta.get(e.project.toLowerCase())||{};p={id:uid(),name:e.project,client:m.client||"",rate:m.rate||0,budget:0,color:COLORS[S.projects.length%COLORS.length],archived:false};S.projects.push(p)}
    S.entries.push({id:uid(),projectId:p.id,date:e.date,secs:e.minutes*60,desc:e.description,billable:e.billable,created:Date.now()+n});n++;
  });
  pendingAI=null;ui.aiText="";save();closeModal();render();toast("Added "+n+(n===1?" entry":" entries"));
}
function readEntryForm(){
  const secs=parseDur($("#e-t").value),d=$("#e-d").value;
  if(!d){$("#e-err").textContent="Pick a date.";return null}
  if(!secs||secs<=0){$("#e-err").textContent="Enter a time like 1:30, 1.5 or 90m.";return null}
  if(secs>24*3600){$("#e-err").textContent="An entry can't be longer than 24 hours.";return null}
  return{projectId:$("#e-p").value,date:d,secs:secs,desc:$("#e-x").value.trim(),billable:$("#e-b").checked};
}
document.addEventListener("click",async ev=>{
  const el=ev.target.closest("[data-a]");
  if(!el){if(ev.target.id==="modal")closeModal();return}
  const a=el.dataset.a,id=el.dataset.id;
  switch(a){
    case "auth-toggle":authMode=authMode==="login"?"register":"login";authErr="";renderAuth();break;
    case "auth-submit":{
      const err=$("#a-err");err.textContent="";el.disabled=true;
      try{
        const r=await fetch("/api/auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:authMode,email:$("#a-e").value,password:$("#a-p").value,code:$("#a-c")?$("#a-c").value:""})});
        const j=await r.json().catch(()=>({}));
        if(!r.ok){err.textContent=j.error||"Something went wrong.";el.disabled=false;return}
        enter(j.user);
      }catch(e){err.textContent="Cannot reach the server.";el.disabled=false}
      break}
    case "logout":{
      try{await fetch("/api/auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"logout"})})}catch(e){}
      authMode="login";signedOut("");break}
    case "inv-create":createInvoice();break;
    case "inv-view":invoiceModal(id);break;
    case "inv-status":{const i=S.invoices.find(x=>x.id===id);if(i){i.status=el.dataset.v;save();render()}break}
    case "inv-del":confirmModal("Delete invoice?","The invoice is removed and its entries become billable again.","Delete",()=>{S.invoices=S.invoices.filter(x=>x.id!==id);S.entries.forEach(e=>{if(e.invoiceId===id)delete e.invoiceId});save();render()});break;
    case "print":window.print();break;
    case "acct-csv":accountingCsv(el.dataset.v);break;
    case "share-project":shareModal(id);break;
    case "share-copy":{const u=$("#share-url");if(u){u.select();if(!(await copyText(u.value,"Link copied")))toast("Select the link and copy it")}break}
    case "share-revoke":try{await api("/api/portal","POST",{action:"revoke",token:el.dataset.v});closeModal();toast("Link revoked")}catch(e){toast(e.message)}break;
    case "ai-voice":voice();break;
    case "ask-go":askGo();break;
    case "team-create":case "team-join":{
      try{await api("/api/team","POST",a==="team-create"?{action:"create",name:$("#t-name").value}:{action:"join",code:$("#t-code").value});ui.team=null;ui.teamKey=null;render()}catch(e){toast(e.message)}break}
    case "team-leave":confirmModal("Leave team?","Owners disband the whole team; members just leave. This can't be undone.","Confirm",async()=>{try{await api("/api/team","POST",{action:"leave"});ui.team=null;ui.teamKey=null;render()}catch(e){toast(e.message)}});break;
    case "team-rotate":try{await api("/api/team","POST",{action:"rotate"});ui.teamKey=null;render();toast("New join code created")}catch(e){toast(e.message)}break;
    case "team-remove":try{await api("/api/team","POST",{action:"remove",userId:id});ui.teamKey=null;render()}catch(e){toast(e.message)}break;
    case "team-csv":{const ms=(ui.team&&ui.team.members)||[];const [x,y]=rangeBounds();saveFile("team-"+x+"-to-"+y+".csv",[["Member","Hours","Billable hours","Earned"]].concat(ms.map(m=>[m.email,dec(m.secs),dec(m.billableSecs),m.amount.toFixed(2)])).map(r=>r.map(csvCell).join(",")).join("\n"));break}
    case "rc-add":{
      const secs=parseDur($("#rc-t").value),days=[0,1,2,3,4,5,6].filter(d=>$("#rc-d"+d)&&$("#rc-d"+d).checked);
      if(!secs||secs>86400){toast("Enter a time like 0:30 or 1.5");break}
      if(!days.length){toast("Pick at least one day");break}
      S.recurring.push({id:uid(),projectId:$("#rc-p").value,secs:secs,desc:$("#rc-x").value.trim(),billable:true,days:days,start:today(),last:null});
      applyRecurring();save();render();toast("Recurring entry added");break}
    case "rc-del":S.recurring=S.recurring.filter(r=>r.id!==id);save();render();break;
    case "key-create":try{const j=await api("/api/account","POST",{action:"keys-create",label:$("#k-label").value.trim()||"API key"});ui.newKey=j.key;ui.keys=null;render()}catch(e){toast(e.message)}break;
    case "key-revoke":try{await api("/api/account","POST",{action:"keys-revoke",id:id});ui.keys=null;render()}catch(e){toast(e.message)}break;
    case "pw-change":{
      const err=$("#pw-err");err.textContent="";
      try{await api("/api/account","POST",{action:"password",current:$("#pw-c").value,next:$("#pw-n").value});$("#pw-c").value="";$("#pw-n").value="";toast("Password changed")}catch(e){err.textContent=e.message}
      break}
    case "acct-delete":
      openModal("Delete your account?",'<p>This permanently deletes your account, all projects, entries, invoices, share links and API keys. Download a backup first if you need one.</p><div class="field"><label class="f" for="del-pw">Confirm with your password</label><input id="del-pw" type="password" autocomplete="current-password"></div><div class="err" id="del-err"></div><div class="foot"><button class="btn" data-a="close">Cancel</button><button class="btn danger" data-a="acct-delete-go">Delete everything</button></div>');break;
    case "acct-delete-go":
      try{await api("/api/account","POST",{action:"delete",current:$("#del-pw").value});try{localStorage.removeItem(KEY)}catch(e){}authMode="login";signedOut("Your account was deleted.")}catch(e){const er=$("#del-err");if(er)er.textContent=e.message}
      break;
    case "tab":ui.tab=el.dataset.v;render();break;
    case "close":closeModal();break;
    case "start":startTimer();break;
    case "stop":stopTimer();break;
    case "discard":confirmModal("Discard timer?","The running time (" + clock(runningSecs()) + ") will not be saved.","Discard",()=>{S.timer=null;save();render()});break;
    case "add-manual":{
      const secs=parseDur($("#mt").value),err=$("#merr");
      if(!$("#md").value){err.textContent="Pick a date.";break}
      if(!secs||secs<=0||secs>86400){err.textContent="Enter a time like 1:30, 1.5 or 90m.";break}
      S.entries.push({id:uid(),projectId:$("#mp").value,date:$("#md").value,secs:secs,desc:$("#mx").value.trim(),billable:$("#mb").checked,created:Date.now()});
      save();render();toast("Added "+hm(secs));break}
    case "edit-entry":entryModal({id:id});break;
    case "del-entry":{
      const i=S.entries.findIndex(e=>e.id===id);if(i<0)break;
      const gone=S.entries.splice(i,1)[0];save();render();
      toast("Entry deleted","Undo",()=>{S.entries.push(gone);save();render()});break}
    case "cell":entryModal({date:el.dataset.d,projectId:el.dataset.p});break;
    case "save-entry":{
      const v=readEntryForm();if(!v)break;
      if(id){Object.assign(S.entries.find(e=>e.id===id),v)}else S.entries.push(Object.assign({id:uid(),created:Date.now()},v));
      save();closeModal();render();break}
    case "ai-parse":aiParse();break;
    case "ai-apply":aiApply();break;
    case "show-all":ui.showAll=!ui.showAll;render();break;
    case "wk-prev":ui.wk=addDays(weekRange()[0],-7);render();break;
    case "wk-next":ui.wk=addDays(weekRange()[0],7);render();break;
    case "wk-this":ui.wk=null;render();break;
    case "new-project":projectModal();break;
    case "edit-project":projectModal(id);break;
    case "arch-project":{const p=proj(id);p.archived=!p.archived;save();render();break}
    case "save-project":{
      const n=$("#p-n").value.trim(),r=parseFloat($("#p-r").value);
      if(!n){$("#p-err").textContent="Give the project a name.";break}
      if(isNaN(r)||r<0){$("#p-err").textContent="Enter an hourly rate (0 if unpaid).";break}
      const c=document.querySelector("input[name=pc]:checked"),vals={name:n,client:$("#p-c").value.trim(),rate:r,budget:parseFloat($("#p-b").value)||0,color:c?c.value:COLORS[0]};
      if(id)Object.assign(proj(id),vals);else S.projects.push(Object.assign({id:uid(),archived:false},vals));
      save();closeModal();render();break}
    case "del-project":{
      const n=S.entries.filter(e=>e.projectId===id).length;
      if(S.timer&&S.timer.projectId===id){$("#p-err").textContent="Stop the running timer first.";break}
      confirmModal("Delete project?","This also deletes its "+n+" logged "+(n===1?"entry":"entries")+". Archiving keeps your history instead.","Delete",()=>{S.projects=S.projects.filter(p=>p.id!==id);S.entries=S.entries.filter(e=>e.projectId!==id);save();render()});break}
    case "range":ui.range=el.dataset.v;render();break;
    case "inv-copy":{const t=invoiceText();if(!(await copyText(t,"Invoice copied")))openModal("Invoice text",'<pre class="out">'+esc(t)+'</pre><div class="foot"><button class="btn" data-a="close">Close</button></div>',true);break}
    case "inv-csv":{const [x,y]=rangeBounds(),p=proj(ui.inv);saveFile("invoice-"+p.name.replace(/\W+/g,"-").toLowerCase()+"-"+x+".csv",csvFor(S.entries.filter(e=>e.projectId===p.id&&e.billable&&!e.invoiceId&&e.date>=x&&e.date<=y)));break}
    case "csv-range":{const [x,y]=rangeBounds();saveFile("timesheet-"+x+"-to-"+y+".csv",csvFor(S.entries.filter(e=>e.date>=x&&e.date<=y)));break}
    case "csv-all":saveFile("timesheet-all.csv",csvFor(S.entries));break;
    case "backup":saveFile("timesheet-backup-"+today()+".json",JSON.stringify(S,null,2));break;
    case "import":$("#file").click();break;
    case "copy-raw":{const t=$("#raw");if(t){t.select();if(!(await copyText(t.value,"Copied")))toast("Select the text and copy it")}break}
    case "sample":loadSample();ui.tab="track";render();toast("Sample data added");break;
    case "clear":confirmModal("Clear everything?","This deletes all projects, entries and settings from this browser. Consider a backup first.","Delete all",()=>{S=defaults();save();render()});break;
  }
});
document.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.id==="file"&&t.files[0]){
    const f=t.files[0],r=new FileReader();
    r.onload=()=>{try{const o=JSON.parse(r.result);if(!Array.isArray(o.projects)||!Array.isArray(o.entries))throw 0;
      confirmModal("Restore backup?","This replaces everything currently in this browser with "+o.projects.length+" projects and "+o.entries.length+" entries.","Restore",()=>{const d=defaults();S=norm({projects:o.projects,entries:o.entries,invoices:o.invoices||[],recurring:o.recurring||[],timer:null,settings:Object.assign(d.settings,o.settings||{})});save();render();toast("Backup restored")})}
      catch(e){toast("That file isn't a Timesheet backup")}};
    r.readAsText(f);return}
  if(t.id&&t.id.indexOf("b-")===0){const k=t.id.slice(2),bz=S.settings.biz;bz[k]=["taxRate","dueDays","nextNo"].indexOf(k)>=0?(Math.max(0,Number(t.value))||0):t.value.trim();save();return}
  if(t.id==="s-cur"){S.settings.currency=t.value.trim()||"$";save();render()}
  else if(t.id==="s-target"){S.settings.target=Math.max(1,Math.min(168,parseFloat(t.value)||40));save();render()}
  else if(t.id==="s-ws"){S.settings.weekStart=+t.value;save();render()}
  else if(t.id==="r-from"||t.id==="r-to"){ui.from=$("#r-from").value;ui.to=$("#r-to").value;render()}
  else if(t.id==="inv-p"){ui.inv=t.value;render()}
});
document.addEventListener("input",ev=>{
  const t=ev.target;
  if(t.id==="td"&&S.timer){S.timer.desc=t.value;save()}
  if(t.id==="inv-n")ui.invNo=t.value;
  if(t.id==="ask-q")ui.askQ=t.value;
  if(t.id==="ai-t")ui.aiText=t.value;
});
document.addEventListener("keydown",ev=>{
  if(ev.key==="Enter"&&ev.target.closest&&ev.target.closest("#authform")){ev.preventDefault();const ab=document.querySelector("[data-a=auth-submit]");if(ab)ab.click();return}
  if(ev.key==="Escape")closeModal();
  if(ev.key==="Enter"&&ev.target.tagName==="INPUT"&&ev.target.type!=="checkbox"){
    const m=$("#modal.open [data-a=save-entry],#modal.open [data-a=save-project]");
    if(m)m.click();else if(ev.target.id==="mt"||ev.target.id==="mx"){const b=document.querySelector("[data-a=add-manual]");if(b)b.click()}
    else if(ev.target.id==="td"){const b=document.querySelector("[data-a=start]");if(b)b.click()}
  }
});
setInterval(()=>{
  if(!S.timer)return;
  const c=$("#clock");if(c)c.textContent=clock(runningSecs());
  document.title="⏱ "+clock(runningSecs())+" · Timesheet";
  if(Math.floor(runningSecs())%30===0)renderHeader();
},1000);
boot();
try{if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}))}catch(e){}
})();
</script>
</body>
